name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".config/docs/**"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  markdownlint:
    name: markdownlint (reviewdog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint with reviewdog
        uses: reviewdog/action-markdownlint@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: warning
          level: warning
          markdownlint_flags: "--config .config/docs/markdownlint.json README.md docs/**/*.md"

  textlint:
    name: textlint (reviewdog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install textlint and rules
        run: |
          npm install -g textlint
          npm install -g textlint-rule-preset-ja-technical-writing

      - name: Run textlint with reviewdog
        uses: tsuyoshicho/action-textlint@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          textlint_flags: "--config .config/docs/textlintrc.json README.md docs/**/*.md"

  cspell:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: .config/docs/cspell.json
          files: |
            README.md
            docs/**/*.md
          inline: warning
          strict: false

  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --config .config/docs/lychee.toml
            README.md
            docs/**/*.md

  vale:
    name: vale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/latest/download/vale_Linux_64-bit.tar.gz
          tar -xzf vale_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/vale
          vale --version

      - name: Sync Vale styles
        run: |
          vale sync --config .config/docs/vale.ini

      - name: Run Vale
        run: |
          vale --config .config/docs/vale.ini README.md docs/**/*.md
